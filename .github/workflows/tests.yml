name: tests
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: bash tests/run_tests.sh
      - run: python3 scripts/assemble_script.py --verify tests/acceptance-1.2.0/reading.md
